name: iOS XCUITest CI

on:
  push:
    branches:
      - main

jobs:
  prepare-tests:
    runs-on: macos-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Ruby and Bundler
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Install dependencies
        run: |
          gem install bundler
          bundle install

      - name: Archive Devices and Testlists (if exist)
        run: |
          echo "Archiving devices-and-testlists contents if they exist"
          mkdir -p archive-testlists
          if [ -d "devices-and-testlists" ]; then
            cp -r devices-and-testlists archive-testlists/
          else
            echo "⚠️ WARNING: devices-and-testlists directory NOT FOUND"
          fi
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: testlists
          path: archive-testlists/

  build-app:
    runs-on: macos-latest
    needs: prepare-tests
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Restore testlists artifacts
        uses: actions/download-artifact@v4
        with:
          name: testlists

      - name: Bundle install
        run: |
          gem install bundler
          bundle install

      - name: Debug testlists location
        run: |
          echo "==============================="
          echo "Listing testlists contents"
          find . -type f
          echo "==============================="

      - name: Build for testing
        run: bundle exec fastlane build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DerivedData
          path: DerivedData

  run-tests:
    runs-on: macos-latest
    needs: build-app
    strategy:
      matrix:
        device: [iphoneFastlane15, iphoneFastlane16]
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Restore build
        uses: actions/download-artifact@v4
        with:
          name: DerivedData

      - name: Restore testlists
        uses: actions/download-artifact@v4
        with:
          name: testlists

      - name: Debug restored files
        run: |
          echo "========== CHECK FILES =========="
          pwd
          ls -la
          find . -name "*.json"
          echo "================================="

      - name: Install dependencies
        run: |
          gem install bundler
          bundle install

      - name: Run tests
        run: |
          TEST_FILE="fastlane/${{ matrix.device }}-tests.json"
          echo "Will look for test file: $TEST_FILE"
          if [ ! -f "$TEST_FILE" ]; then
            echo "❌ TEST FILE NOT FOUND: $TEST_FILE"
            exit 1
          fi
          bundle exec fastlane test \
            id:${{ matrix.device }} \
            test_list:$TEST_FILE

  generate-report:
    runs-on: macos-latest
    needs: run-tests
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Generate Allure Report
        run: |
          echo "Generating Allure Report (placeholder step)"
