name: CI

on:
  push:
    branches:
      - main

jobs:
  prepare-tests:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Ruby
        run: |
          brew install ruby
          gem install bundler

      - name: Create dummy testlists
        run: |
          mkdir -p devices-and-testlists/testlists
          echo '{"MyTest": "Enabled"}' > devices-and-testlists/testlists/iphoneFastlane16-tests.json
          echo '{"MyTest": "Enabled"}' > devices-and-testlists/testlists/iphoneFastlane15-tests.json

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: testlists
          path: devices-and-testlists/testlists/*.json

  build-app:
    runs-on: macos-latest
    needs: prepare-tests
    steps:
      - uses: actions/checkout@v4

      - name: Download testlists artifact
        uses: actions/download-artifact@v4
        with:
          name: testlists

      - name: Install dependencies
        run: bundle install

      - name: Build app for testing
        run: bundle exec fastlane build

      - name: Upload DerivedData
        uses: actions/upload-artifact@v4
        with:
          name: derived-data
          path: DerivedData

  run-tests:
    runs-on: macos-latest
    needs: build-app
    strategy:
      matrix:
        device: [iphoneFastlane15, iphoneFastlane16]
    steps:
      - uses: actions/checkout@v4

      - name: Download testlists artifact
        uses: actions/download-artifact@v4
        with:
          name: testlists

      - name: Download DerivedData
        uses: actions/download-artifact@v4
        with:
          name: derived-data

      - name: Run tests
        run: |
          bundle exec fastlane test id:${{ matrix.device }} \
          test_list:devices-and-testlists/testlists/${{ matrix.device }}-tests.json

  generate-report:
    runs-on: macos-latest
    needs: run-tests
    steps:
      - name: Generate Allure report
        run: echo "generate allure report placeholder"
